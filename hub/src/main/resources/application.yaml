spring:
  application:
    name: hub-service
#  profiles:
#    active: dev
  datasource:
    url: ${HUB_DB_URL}
    username: ${HUB_DB_USERNAME}
    password: ${HUB_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 19093

# Eureka 클라이언트
eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/