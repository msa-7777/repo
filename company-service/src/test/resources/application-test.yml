spring:
  datasource:
    url: jdbc:h2:mem:product-test-db
    driver-class-name: org.h2.Driver
    username: user
    password: pwd

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    org.hibernate.SQL: debug