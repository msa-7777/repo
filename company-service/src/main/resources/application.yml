## Hub 서비스 연동 포트 (19093)
hub-service:
  url: ${HUB_SERVICE_URL:http://localhost:19093}
## User 서비스 연동 포트 (19095)
user-service:
  url: ${USER_SERVICE_URL:http://localhost:19095}

# Zipkin 적용
management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0