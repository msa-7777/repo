# 서비스 간 통신을 위해 DB 설정 변경
  datasource:
    # url: ${DB_URL:jdbc:postgresql://localhost:5437/logistics_db}
    url: ${DB_URL:jdbc:postgresql://localhost:5437/logistics_db?currentSchema=company_schema}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update

      properties:
        hibernate:
          # default_schema: ${DB_SCHEMA:company_schema}
          format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG

