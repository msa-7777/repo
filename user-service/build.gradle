plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sparta'
version = '0.0.1-SNAPSHOT'
description = 'msa-7'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web' // spring-boot-starter-webmvc -> 이건 4.x버전
    implementation 'org.springframework.boot:spring-boot-starter-security' // spring-boot-security

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta' // JPA에서 JpaQueryFactory
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16' // Swagger

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql' // PostgreSQL 드라이버 의존성

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
