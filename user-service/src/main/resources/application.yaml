spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/distribution_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}