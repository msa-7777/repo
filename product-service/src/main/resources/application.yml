server:
  port: 19095

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:h2:mem:product-db
    driver-class-name: org.h2.Driver
    username: user
    password: pwd

  h2:
    console:
      enabled: true
      path: /h2-console
      # http://localhost:8081/h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
      # ddl-auto: update
      # 유지할 때 update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Eureka 클라이언트
eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/