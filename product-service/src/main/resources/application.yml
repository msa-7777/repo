# 서비스 간 통신을 위해 DB 설정 변경
  datasource:
    # url: ${DB_URL:jdbc:postgresql://localhost:5437/logistics_db}
    url: ${DB_URL:jdbc:postgresql://localhost:5437/logistics_db?currentSchema=product_schema}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        # default_schema: ${DB_SCHEMA:product_schema}
        format_sql: true


# feign timeout
  cloud:
    openfeign:
      client:
        config:
          company-service:
            connectTimeout: 3000
            readTimeout: 5000


# Eureka 클라이언트
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:19090/eureka/}