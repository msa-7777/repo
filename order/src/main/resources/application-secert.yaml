server:
  port: 8081 # API GW(보통 8080)와 충돌 방지를 위한 독립 포트

spring:
  application:
    name: order-service # [중요] MSA 환경에서 서비스 식별자(신분증) 역할

  # PostgreSQL DB 설정 (로컬 환경)
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb # 사전에 orderdb 생성 필요
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # 엔티티 변경 시 DB 스키마 자동 업데이트 (로컬 개발용)
    show-sql: true # 실행되는 SQL 로그 확인
    properties:
      hibernate:
        format_sql: true # SQL 가독성 향상

# Eureka 클라이언트 설정 (현재 미구축 상태 대비)
eureka:
  client:
    register-with-eureka: false # 서버 등록 임시 비활성화
    fetch-registry: false # 레지스트리 정보 가져오기 임시 비활성화
    service-url:
      defaultZone: http://localhost:8761/eureka/ # 향후 연결할 유레카 서버 주소